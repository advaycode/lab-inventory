<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Admin | Lab Inventory</title>
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#0e0b0a">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23e44642'/%3E%3Cpath d='M9 8v16h14' stroke='%23150706' stroke-width='3.4' fill='none' stroke-linecap='square'/%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/css/theme.css">
<link rel="stylesheet" href="assets/css/app.css">
<link rel="stylesheet" href="assets/css/admin.css">
</head>
<body>

<div class="aribbon" role="note">Admin</div>

<svg width="0" height="0" aria-hidden="true" focusable="false" style="position:absolute">
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M15.8 15.8 20 20"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
  <symbol id="i-chev" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></symbol>
  <symbol id="i-box" viewBox="0 0 24 24"><path d="M12 3 4 7.2v9.6L12 21l8-4.2V7.2z"/><path d="M4 7.2 12 11.5l8-4.3M12 11.5V21"/></symbol>
  <symbol id="i-theme" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><path d="M12 2v2M12 20v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M2 12h2M20 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M4.5 12.5 9.5 17.5 19.5 6.5"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-out" viewBox="0 0 24 24"><path d="M15 4h4v16h-4"/><path d="M11 8l4 4-4 4M15 12H3"/></symbol>
  <symbol id="i-edit" viewBox="0 0 24 24"><path d="M4 20h4L19 9a2.8 2.8 0 0 0-4-4L4 16z"/></symbol>
  <symbol id="i-img" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="m3.5 18 5-5 4.5 4.5L16 15l4.5 4.5"/></symbol>
</svg>

<!-- Until login succeeds this is the entire page. The admin shell lives in a
     <template> and is not instantiated, so nothing behind the gate exists in
     the DOM for an unauthenticated visitor to read. -->
<div id="gate" class="gate">
  <div class="gate__card">
    <div class="gate__mark">LAB<b>/</b>INVENTORY<span>Admin</span></div>
    <h1>Sign in</h1>
    <p>The password is checked by the Apps Script backend. It is never stored in this browser.</p>
    <form id="loginForm" novalidate>
      <div class="field">
        <label for="pw">Admin password</label>
        <input class="input" id="pw" type="password" autocomplete="current-password"
               name="password" autofocus>
        <p class="err" id="pwErr"></p>
      </div>
      <button class="btn btn--primary btn--block" type="submit" id="loginBtn">Sign in</button>
    </form>
  </div>
</div>

<template id="shellTpl">
  <header class="abar">
    <span class="abar__mark">LAB<b>/</b>INVENTORY<em>Admin</em></span>
    <div class="tabs" role="tablist" aria-label="Admin sections">
      <button role="tab" type="button" data-tab="queue" aria-selected="true">
        <span class="tabtext">Queue</span>
        <span class="pill pill--zero" id="pendingPill">0</span>
      </button>
      <button role="tab" type="button" data-tab="parts" aria-selected="false"><span class="tabtext">Parts</span></button>
      <button role="tab" type="button" data-tab="stats" aria-selected="false"><span class="tabtext">Stats</span></button>
    </div>
    <span class="abar__spacer"></span>
    <button class="btn btn--sm btn--ghost btn--icon" id="themeBtn" type="button" title="Switch to light theme">
      <svg class="icon"><use href="#i-theme"/></svg><span class="u-sr" id="themeLabel">Switch to light theme</span>
    </button>
    <button class="btn btn--sm btn--ghost" id="logoutBtn" type="button">
      <svg class="icon"><use href="#i-out"/></svg><span class="btn__text">Sign out</span>
    </button>
  </header>

  <main class="wrap" id="wrap">

    <section class="view" id="view-queue" role="tabpanel" aria-label="Approval queue" tabindex="-1">
      <div class="view__head">
        <div style="flex:1">
          <h1>Approval queue</h1>
          <p>Newest first. Nothing moves in the inventory until you approve it.</p>
        </div>
        <button class="btn btn--sm" id="refreshBtn" type="button">Refresh</button>
      </div>
      <dl class="metrics" id="queueMetrics"></dl>
      <div class="queue" id="queue"></div>
    </section>

    <section class="view" id="view-parts" role="tabpanel" aria-label="Parts" tabindex="-1" hidden>
      <div class="view__head">
        <div style="flex:1">
          <h1>Parts</h1>
          <p>Set counts, locations, and photos. Search matches names, part numbers, and categories.</p>
        </div>
        <button class="btn btn--sm btn--primary" id="newPartBtn" type="button">
          <svg class="icon"><use href="#i-plus"/></svg> New part
        </button>
      </div>
      <div class="toolbar">
        <div class="search" id="adminSearchWrap">
          <svg class="icon search__icon"><use href="#i-search"/></svg>
          <label class="u-sr" for="pq">Search parts</label>
          <input class="search__input" id="pq" type="search" autocomplete="off"
                 placeholder="Search parts, part numbers, categories">
          <button class="search__clear" id="pqClear" type="button">
            <span class="u-sr">Clear</span><svg class="icon" style="width:14px;height:14px"><use href="#i-x"/></svg>
          </button>
        </div>
        <span class="mono muted" id="partCount" style="font-size:var(--t-sm)"></span>
      </div>
      <div class="plist" id="plist"></div>
      <div class="more" id="more"></div>
    </section>

    <section class="view" id="view-stats" role="tabpanel" aria-label="Statistics" tabindex="-1" hidden>
      <div class="view__head">
        <div style="flex:1">
          <h1>Stats</h1>
          <p>Counts come from the sheet, so they are the truth rather than this browser's cache.</p>
        </div>
      </div>
      <dl class="metrics" id="statMetrics"></dl>
      <h2 style="font-size:var(--t-lg);margin-bottom:var(--s3)">Overdue</h2>
      <div class="overdue" id="overdue"></div>
    </section>

  </main>
</template>

<div class="toasts" id="toasts" role="status" aria-live="polite"></div>

<!-- CONTRACT 6: fixed bottom-left credit, real DOM text, 9px, .06em, muted, .75 -->
<p class="credit">Created by Midnight 26588</p>

<script type="module" src="assets/js/admin.js"></script>
</body>
</html>
